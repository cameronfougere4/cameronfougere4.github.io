<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="my_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <div id="main-nav"></div>
    <script src="nav.js"></script>
    <script>
        setNav(window.location.pathname);
    </script>

    <main>
        <h1>My To-Do List</h1>

        <!-- Add item form -->
        <form id="todo_form" onsubmit="return addItem(event)">
            <input type="text" id="todo_input" placeholder="Add a task">
            <button type="submit">Add to list</button>
        </form>

        <!-- List -->
		<h2>My to-do list this week</h2>
        <ul id="todo_list"></ul>
    </main>

    <script src="to-do.js"></script>
</body>
</html>
